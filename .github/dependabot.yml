# Weekly version bumps as pull requests: actions, reusable workflows (pipelines tags) and Terraform.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: terraform
    directories: ["/bootstrap"]
    schedule:
      interval: weekly
    groups:
      terraform:
        patterns: ["*"]
