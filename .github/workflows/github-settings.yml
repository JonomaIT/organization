name: GitHub settings

# Applies github/ (the org standard: repo settings, security, rulesets, Actions policy).
#   pull request   plan with the read-only app, shown in the run summary
#   main, manual   plan (read-only app), then ONE approval in the `management` environment, then
#                  apply of exactly that plan with the write app; no changes = nothing to approve
#   every night    drift check: plan only; changes made by hand in the UI fail the run
#
# Two GitHub Apps, like the plan and write roles of the bootstrap:
#   jonomait-settings-plan   Administration: read (repos and org)   repo secret/variable
#   jonomait-settings        Administration: read/write             only in the `management` environment
# State: the management account, role github-actions-organization[-plan] from bootstrap/.
on:
  pull_request:
    branches:
      - main
    paths:
      - github/**
      - .github/workflows/github-settings.yml
  push:
    branches:
      - main
    paths:
      - github/**
      - .github/workflows/github-settings.yml
  schedule:
    - cron: "0 10 * * *" # 07:00 in Brasília
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC with AWS

# Never two runs on the same state; an apply is never interrupted halfway.
concurrency:
  group: github-settings-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  ACCOUNT_ID: ${{ fromJSON(vars.AWS_ACCOUNT_IDS || '{}').management }}
  STATE_BUCKET: ${{ vars.PROJECT_PREFIX }}-management-tfstate
  STATE_REGION: ${{ vars.STATE_REGION }}
  STATE_KEY: management/global/github

jobs:
  plan:
    name: plan
    # Skipped (not failed) until the apps and the management account are set up.
    if: vars.SETTINGS_PLAN_APP_CLIENT_ID != '' && vars.AWS_ACCOUNT_IDS != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      changes: ${{ steps.plan.outputs.changes }}
    defaults:
      run:
        working-directory: github
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ vars.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: AWS credentials (read-only)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ env.ACCOUNT_ID }}:role/github-actions-${{ github.event.repository.name }}-plan
          aws-region: ${{ env.STATE_REGION }}

      - name: GitHub token (read-only app)
        id: app
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.SETTINGS_PLAN_APP_CLIENT_ID }}
          private-key: ${{ secrets.SETTINGS_PLAN_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Terraform init
        run: terraform init -backend-config="bucket=$STATE_BUCKET" -backend-config="region=$STATE_REGION" -backend-config="key=$STATE_KEY"

      - name: Terraform plan
        id: plan
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token }}
          EVENT: ${{ github.event_name }}
        run: |
          set +e # -detailed-exitcode: 0 no changes, 1 error, 2 changes
          terraform plan -lock-timeout=5m -no-color -detailed-exitcode -out=tfplan > plan.txt 2>&1
          rc=$?
          set -e
          cat plan.txt
          {
            echo "### GitHub settings plan"
            echo '```'
            grep -E '^(Plan:|No changes|Error)|will be (created|updated|destroyed|imported)|must be replaced' plan.txt || true
            echo '```'
            echo "<details><summary>Full plan</summary>"
            echo
            echo '```'
            cat plan.txt
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
          case $rc in
            0) echo "changes=false" >> "$GITHUB_OUTPUT" ;;
            2)
              echo "changes=true" >> "$GITHUB_OUTPUT"
              if [ "$EVENT" = "schedule" ]; then
                echo "::error title=Drift::GitHub settings differ from github/ (changed by hand in the UI?). See the plan in the run summary."
                exit 1
              fi
              ;;
            *) exit 1 ;;
          esac

      - name: Save the plan
        if: steps.plan.outputs.changes == 'true' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: github-settings-tfplan
          path: github/tfplan
          retention-days: 1

  apply:
    name: apply
    needs: plan
    if: needs.plan.outputs.changes == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: management # required reviewer; the only place the write app and role are reachable
    defaults:
      run:
        working-directory: github
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ vars.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: AWS credentials (write)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ env.ACCOUNT_ID }}:role/github-actions-${{ github.event.repository.name }}
          aws-region: ${{ env.STATE_REGION }}

      - name: GitHub token (write app)
        id: app
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.SETTINGS_APP_CLIENT_ID }}
          private-key: ${{ secrets.SETTINGS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Download the approved plan
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: github-settings-tfplan
          path: github

      - name: Terraform init
        run: terraform init -backend-config="bucket=$STATE_BUCKET" -backend-config="region=$STATE_REGION" -backend-config="key=$STATE_KEY"

      - name: Terraform apply
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token }}
        run: terraform apply -lock-timeout=5m -no-color tfplan
